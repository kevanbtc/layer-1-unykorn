name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us resolve the issue.
        
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see!
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true
      
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Start the network with '...'
        2. Deploy contract '...'
        3. Call function '...'
        4. See error
    validations:
      required: true
      
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - Smart Contracts
        - Blockchain Node (Besu)
        - CI/CD Pipeline
        - Documentation
        - Deployment Scripts
        - Docker Configuration
        - Hardhat Configuration
        - Other
    validations:
      required: true
      
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Unykorn L1 are you using?
      placeholder: e.g., 1.0.0, main branch commit hash
      
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Describe your environment
      placeholder: |
        - OS: Ubuntu 22.04 / Windows 11 / macOS 14
        - Node.js: v20.10.0
        - Docker: 24.0.0
        - Network: local / testnet / mainnet
      
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Please paste any relevant logs or error messages
      render: shell
      
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
